name: CI

on:
  push:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn pytest ruff

      - name: Verify ML imports
        run: python -c "from src.models.logistic_regression import train_class_weighted_logistic_regression"

      - name: Run tests
        run: python -m pytest tests -v

      - name: Run Ruff
        run: ruff check src tests